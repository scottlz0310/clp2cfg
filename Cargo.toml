[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/scottlz0310/clp2cfg"

# 依存の版はここで一元化する（Renovate の更新を 1 か所にまとめるため）
[workspace.dependencies]
arboard = "3.7.0"
clap = { version = "4.6.7", features = ["derive"] }
dirs = "7.0.0"
eframe = { version = "0.37.0", features = ["persistence"] }
egui = "0.37.0"
image = { version = "0.25.10", default-features = false, features = ["png", "ico"] }
json5 = "1.3.6"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tempfile = "3.27.0"
thiserror = "2.0.21"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
winres = "0.1.12"
