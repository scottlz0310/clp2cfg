[package]
name = "clp2cfg"
version = "0.1.0"
edition = "2021"
description = "Lightweight GUI tool to parse and merge MCP server config snippets into AI client configurations"
license = "MIT OR Apache-2.0"
repository = "https://github.com/scottlz0310/clp2cfg"

[dependencies]
eframe = "0.31"
egui = "0.31"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
dirs = "6.0"
tempfile = "3.17"
thiserror = "2.0"
tracing = "0.1"
tracing-subscriber = "0.3"
json5 = "1.3.6"
