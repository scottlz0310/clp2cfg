[package]
name = "clp2cfg"
version = "0.1.0"
edition = "2021"
description = "Lightweight GUI tool to parse and merge MCP server config snippets into AI client configurations"
license = "MIT OR Apache-2.0"
repository = "https://github.com/scottlz0310/clp2cfg"

[dependencies]
eframe = "0.31.1"
egui = "0.31.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
dirs = "7.0.0"
tempfile = "3.27.0"
thiserror = "2.0.21"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
json5 = "1.3.6"
arboard = "3.7.0"
