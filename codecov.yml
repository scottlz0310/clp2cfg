codecov:
  require_ci_to_pass: yes
  notify:
    wait_for_ci: yes

coverage:
  precision: 2
  round: down
  range: "70...100"

  status:
    project:
      default:
        target: 80%
        threshold: 2%
        informational: false
        if_ci_failed: error

    patch:
      default:
        target: 80%
        threshold: 5%
        informational: false
        if_ci_failed: error

  ignore:
    - "crates/clp2cfg/src/main.rs"
    - "crates/clp2cfg-cli/src/main.rs"
    # OS・プロセス・ウィンドウの配線だけのファイル。薄さは tests/architecture_test.rs（ENTRY_POINTS）が行数で守る
    - "crates/clp2cfg/src/entry.rs"
    - "crates/clp2cfg-cli/src/entry.rs"

comment:
  layout: "reach,diff,flags,tree"
  behavior: default
  require_changes: false
  require_base: no
  require_head: yes

github_checks:
  annotations: true
